services:
  - type: web
    name: cpc-conexao-por-creditos
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund --workspaces=false
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_WORKSPACES
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://cpc-conexao-por-creditos-qlq0.onrender.com
      # Banco MySQL permanente (contas e Face ID/digital). Use DATABASE_URL OU as variáveis DB_* abaixo.
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_CONNECTION_LIMIT
        value: "5"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: WEBAUTHN_RP_ID
        value: cpc-conexao-por-creditos-qlq0.onrender.com
      - key: WEBAUTHN_ORIGIN
        value: https://cpc-conexao-por-creditos-qlq0.onrender.com
